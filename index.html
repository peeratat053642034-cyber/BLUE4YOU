<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE4YOU</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma,sans-serif;
}
body{
    background:#020b25;
    color:#fff;
    max-width:430px;
    margin:auto;
}
.banner img{
    width:100%;
    display:block;
}

.btn{
    display:block;
    width:92%;
    margin:15px auto;
    text-align:center;
    padding:18px;
    border-radius:15px;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.register{
    background:linear-gradient(#1e90ff,#004cff);
    color:#fff;
    box-shadow:0 0 15px #008cff;
}

.line{
    background:#00c300;
    color:#fff;
    box-shadow:0 0 15px #00ff55;
}

.box{
    width:92%;
    margin:15px auto;
    background:#08163d;
    border:1px solid #2d8cff;
    border-radius:15px;
    padding:15px;
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.online{
    color:#00ff66;
    font-size:28px;
    font-weight:bold;
}

.bonus{
    color:#ffd84a;
    font-size:34px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="banner">
<img src="banner.jpg">
</div>

<a class="btn register"
href="https://blue4you.zzttyy.com/customer/regi/ka">
สมัครสมาชิก
</a>

<a class="btn line"
href="https://lin.ee/5WrfDvQ">
ติดต่อแอดมิน LINE
</a>

<div class="box">
<div class="title">👥 ผู้ใช้งานออนไลน์</div>
<div class="online" id="online">842,365</div>
</div>

<div class="box">
<div class="title">💰 โบนัสสะสม</div>
<div class="bonus" id="bonus">7,521,358 บาท</div>
</div>

<script>

let online=842365;
let bonus=7521358;

setInterval(()=>{

online+=Math.floor(Math.random()*4);

bonus+=Math.floor(Math.random()*300);

document.getElementById("online").innerHTML=
online.toLocaleString();

document.getElementById("bonus").innerHTML=
bonus.toLocaleString()+" บาท";

},1500);

</script>

</body>
</html>
